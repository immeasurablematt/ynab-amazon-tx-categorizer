version: 2

goal:
  title: "YNAB Repo Improvements"
  slug: "ynab-repo-improvements"
  kind: open_ended
  tranche: "Discover, prioritize, implement, verify, and audit successive reliability and safety improvement slices."
  status: active
  intake:
    original_request: "Use GoalBuddy prep; improve the YNAB Automation repo."
    interpreted_outcome: "A later /goal run should improve the YNAB Automation repo by prioritizing reliability and safety, finding the highest-leverage safe local work, implementing bounded verified slices, and auditing completion."
    input_shape: vague
    audience: "User as non-developer repo owner"
    authority: requested
    proof_type: test
    completion_proof: "Tests/checks prove risky YNAB or finance workflows default to dry-run, require explicit approval before live data changes, or otherwise have clear guardrails; completed Worker receipts and a final Judge/PM audit map those checks back to the original reliability/safety outcome."
    likely_misfire: "GoalBuddy could perform generic cleanup or planning without improving reliability, dry-run confidence, live-finance safety, or automation guardrails."
    blind_spots_considered:
      - "Local checkout already has unrelated untracked work and is ahead of origin/main."
      - "Improvement target is reliability and safety first."
      - "Safety proof should prioritize explicit live-write guardrails and dry-run confidence over generic cleanup."
      - "Live YNAB or bank-data changes are out of scope unless the user gives fresh explicit approval inside the /goal run."
    existing_plan_facts: []
    goal_handling: "Use this fresh GoalBuddy board; do not inspect or reuse another existing goal before starting unless the user changes direction."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://127.0.0.1:41737/"
    command: "npx goalbuddy board docs/goals/ynab-repo-improvements"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: T008

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Map repo purpose, current state, verification commands, health signals, and reliability/safety improvement candidates."
    inputs:
      - "Repo root"
      - "Existing docs"
      - "Existing tests and scripts"
      - "Git status and worktree state"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Preserve unrelated local changes."
      - "Do not make live YNAB or bank-data changes."
      - "Prefer concrete file-path evidence over generic advice."
    expected_output:
      - "Repo map"
      - "Verification commands"
      - "Ranked reliability/safety improvement candidates"
      - "Existing live-write or destructive-operation guardrails"
      - "Candidate next tasks"
    receipt:
      result: done
      summary: "Mapped the repo and found the highest-confidence first safety gap: the root CLI importer writes live YNAB transactions via create_transaction with no dry-run or explicit execute gate, while existing tests do not cover importer live-write safety."
      evidence:
        - "ynab_import.py: live transactions_api.create_transaction call after CSV parsing and duplicate checks"
        - "docs/README_YNAB_IMPORT.md: documents running python ynab_import.py as the import command"
        - "app/api/import/route.ts: separate live web import route, higher blast radius but less surgical for first slice"
        - "tools/ynab_mcp_server.py: updateTransactions is intentionally narrow but still live-write capable"
        - "tests/test_ynab_mcp_server.py and tests/test_amazon_reports_to_ynab.py: no ynab_import dry-run/execute guard coverage"
      commands:
        - cmd: "python3 -m unittest discover -s tests"
          status: pass
          notes: "Ran 32 tests; existing urllib3 LibreSSL warning and parser warning only."
      spawned_tasks:
        - T002
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: default
    objective: "Review Scout findings and choose the first safe implementation task."
    inputs:
      - "T001 receipt"
      - "User-confirmed improvement target"
      - "User-confirmed success proof"
    constraints:
      - "Do not implement."
      - "Pick small reviewable work."
      - "Respect finance-data safety and Git/worktree hygiene rules."
      - "Prefer tasks that can be proven by tests or dry-run checks."
      - "Do not choose a Worker task that requires live YNAB or bank-data changes unless the user gives fresh explicit approval."
    expected_output:
      - "Decision"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Blocked or deferred tasks"
    receipt:
      result: done
      decision: "Do the CLI importer safety gate first. It directly addresses the chosen proof standard, is more surgical than the public web route, and can be proven with unit tests without touching live YNAB data."
      exact_worker_objective: "Make ynab_import.py default to dry-run and require an explicit execute flag before transactions_api.create_transaction can run, then document and test that boundary."
      allowed_files:
        - "ynab_import.py"
        - "tests/test_ynab_import_safety.py"
        - "docs/README_YNAB_IMPORT.md"
        - "README.md"
        - "CLAUDE.md"
        - "docs/goals/ynab-repo-improvements/state.yaml"
      verify:
        - "python3 -m unittest discover -s tests"
        - "python3 ynab_import.py --help"
      stop_if:
        - "Implementation requires live YNAB credentials."
        - "Need to alter web import behavior or unrelated scripts."
        - "Tests require network access."
      next_allowed_task: T003
  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: default
    objective: "Make ynab_import.py default to dry-run and require an explicit execute flag before transactions_api.create_transaction can run, then document and test that boundary."
    allowed_files:
