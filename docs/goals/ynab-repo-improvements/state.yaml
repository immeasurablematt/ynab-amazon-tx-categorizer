        - "tests/test_ynab_import_safety.py"
        - "docs/README_YNAB_IMPORT.md"
        - "README.md"
        - "CLAUDE.md"
      commands:
        - cmd: "python3 -m unittest discover -s tests"
          status: pass
          notes: "Ran 35 tests; existing urllib3 LibreSSL warning and parser warning only."
        - cmd: "python3 ynab_import.py --help"
          status: pass
          notes: "Help shows dry-run default and --execute live-write flag."
      summary: "ynab_import.py now defaults to dry-run, stops before create_transaction unless --execute is supplied, and documentation now separates preview from live import."
  - id: T999
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: default
    objective: "Audit whether the implemented work satisfies the current YNAB repo-improvement tranche."
    inputs:
      - "All done task receipts"
      - "Last verification"
      - "Current dirty diff"
      - "Original user outcome"
    constraints:
      - "Do not implement."
      - "Reject completion if required Worker work is still queued or active."
      - "Reject completion if the broader original outcome still has safe local follow-up slices."
      - "Reject completion if live-write safety is not addressed or explicitly scoped out by receipt evidence."
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "missing evidence"
      - "next task if not complete"
    receipt:
      result: done
      decision: "not_complete"
      full_outcome_complete: false
      summary: "T003 satisfies one high-value guardrail by making the main importer dry-run-first. The broader reliability/safety tranche still has a safe local follow-up: ynab_cleanup_amazon.py can delete duplicates and update categories live without a dry-run/execute gate."
